<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Junis · OBS Minimap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

    /* Rounded panel — covers the minimap */
    .panel {
      position: fixed;
      inset: 0;
      background: #03080f;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(79, 143, 212, 0.85);
      box-shadow:
        inset 0 0 30px rgba(79, 143, 212, 0.12),
              0 0 30px rgba(79, 143, 212, 0.35);
    }

    /* Stars behind everything */
    #stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    /* Silhouette clipped to the panel */
    .silhouette-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .jun-silhouette {
      position: absolute;
      height: 140%;
      aspect-ratio: 1704 / 923;
      top: -8%;
      left: 50%;
      transform: translateX(-50%);
      -webkit-mask-image: url(junis-mask.png);
      mask-image: url(junis-mask.png);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      animation: junBreathe 5s ease-in-out infinite;
      opacity: 0;
      transition: opacity 2.4s ease;
    }

    .jun-silhouette.visible { opacity: 1; }

    @keyframes junBreathe {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50%       { transform: translateX(-50%) scale(1.013, 1.016); }
    }

    #jun-body { width: 100%; height: 100%; display: block; }

    /* Name overlay */
    .jun-name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      white-space: nowrap;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(1.8rem, 10vh, 3.2rem);
      letter-spacing: 0.18em;
      color: #fff;
      text-shadow:
        0 0 40px  rgba(79, 143, 212, 0.35),
        0 0 100px rgba(79, 143, 212, 0.12);
      transition: opacity 1.5s ease;
    }

    .jun-name .letter { display: inline-block; opacity: 0; }
    .jun-name .letter.appearing { animation: letterFlare 1.4s ease forwards; }

    @keyframes letterFlare {
      0%   { opacity: 0; filter: brightness(1)   drop-shadow(0 0 0px  rgba(180,220,255,0)); }
      18%  { opacity: 1; filter: brightness(3.5) drop-shadow(0 0 28px rgba(160,210,255,0.95)); }
      55%  { opacity: 1; filter: brightness(1.4) drop-shadow(0 0 12px rgba(140,195,255,0.5)); }
      100% { opacity: 1; filter: brightness(1)   drop-shadow(0 0 0px  rgba(140,195,255,0)); }
    }

    /* Bloom on load */
    .bloom {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 55%,
        rgba(50, 110, 255, 0.55) 0%,
        rgba(30,  70, 210, 0.22) 40%,
        transparent 70%
      );
      opacity: 0;
      pointer-events: none;
      transform: scale(0.1);
      z-index: 2;
    }

    .bloom.blooming {
      animation: bloomPulse 4s ease forwards;
    }

    @keyframes bloomPulse {
      0%   { opacity: 0;   transform: scale(0.1); }
      22%  { opacity: 1;   transform: scale(1.1); }
      55%  { opacity: 0.5; transform: scale(1.4); }
      100% { opacity: 0;   transform: scale(1.7); }
    }
  </style>
</head>
<body>

  <div class="panel">
    <canvas id="stars"></canvas>
    <div class="silhouette-wrap">
      <div class="jun-silhouette" id="silhouette">
        <canvas id="jun-body"></canvas>
      </div>
    </div>
    <div class="jun-name" id="jun-name">
      <span class="letter">J</span><span class="letter">U</span><span class="letter">N</span><span class="letter">I</span><span class="letter">S</span>
    </div>
    <div class="bloom" id="bloom"></div>
  </div>

  <script>
    // ── Stars ─────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('stars');
    const ctx    = canvas.getContext('2d');
    let W = 0, H = 0, stars = [], shooters = [];

    function resize() {
      W = canvas.width  = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
      stars = Array.from({ length: 70 }, () => ({
        x:     Math.random() * W,
        y:     Math.random() * H,
        r:     Math.random() * 1.0 + 0.1,
        base:  Math.random() * 0.5 + 0.1,
        amp:   Math.random() * 0.2 + 0.05,
        freq:  Math.random() * 0.0005 + 0.0001,
        phase: Math.random() * Math.PI * 2,
      }));
    }

    function spawnShooter() {
      const speed = Math.random() * 2.5 + 2;
      const angle = (Math.PI / 180) * (20 + Math.random() * 20);
      shooters.push({
        x: Math.random() * W * 0.6, y: Math.random() * H * 0.4,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        len: Math.random() * 50 + 30, life: 0,
        rate: Math.random() * 0.008 + 0.006, big: false,
      });
      setTimeout(spawnShooter, 6000 + Math.random() * 2000);
    }

    function spawnBigShooter() {
      const fromLeft = Math.random() < 0.5;
      shooters.push({
        x: fromLeft ? 0 : W,
        y: Math.random() * H * 0.5,
        vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 2),
        vy: 1.5 + Math.random() * 1,
        len: 120, life: 0, rate: 0.009, big: true,
      });
      setTimeout(spawnBigShooter, 18000 + Math.random() * 2000);
    }

    function animateBg(t) {
      ctx.clearRect(0, 0, W, H);

      for (const s of stars) {
        const o = s.base + Math.sin(t * s.freq * 1000 + s.phase) * s.amp;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(190,215,255,${Math.min(1, Math.max(0, o))})`;
        ctx.fill();
      }

      for (let i = shooters.length - 1; i >= 0; i--) {
        const s = shooters[i];
        s.x += s.vx; s.y += s.vy; s.life += s.rate;
        let o = s.life < 0.15 ? s.life / 0.15 : s.life > 0.75 ? (1 - s.life) / 0.25 : 1;
        o = Math.max(0, Math.min(1, o));
        const a  = Math.atan2(s.vy, s.vx);
        const tx = s.x - Math.cos(a) * s.len, ty = s.y - Math.sin(a) * s.len;
        const g  = ctx.createLinearGradient(tx, ty, s.x, s.y);
        g.addColorStop(0, 'rgba(160,200,255,0)');
        g.addColorStop(1, `rgba(230,240,255,${o * 0.9})`);
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(s.x, s.y);
        ctx.strokeStyle = g; ctx.lineWidth = s.big ? 2.2 : 1.2; ctx.stroke();
        ctx.beginPath(); ctx.arc(s.x, s.y, s.big ? 2.4 : 1.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245,250,255,${o})`; ctx.fill();
        if (s.life >= 1 || s.x > W + 50 || s.x < -50 || s.y > H + 50) shooters.splice(i, 1);
      }

      requestAnimationFrame(animateBg);
    }


    // ── Jun body ──────────────────────────────────────────────────────────────

    const junCanvas = document.getElementById('jun-body');
    const junCtx    = junCanvas.getContext('2d');
    let junStars    = [];

    function initJunStars() {
      const w = junCanvas.offsetWidth  || 500;
      const h = junCanvas.offsetHeight || 270;
      junCanvas.width  = w;
      junCanvas.height = h;
      junStars = Array.from({ length: 90 }, () => ({
        x:     Math.random() * w,
        y:     Math.random() * h,
        r:     Math.random() * 1.4 + 0.2,
        base:  Math.random() * 0.65 + 0.2,
        amp:   Math.random() * 0.22 + 0.06,
        freq:  Math.random() * 0.0008 + 0.0002,
        phase: Math.random() * Math.PI * 2,
      }));
    }

    function animateJun(t) {
      const w = junCanvas.width, h = junCanvas.height;
      junCtx.clearRect(0, 0, w, h);
      junCtx.fillStyle = '#03080f';
      junCtx.fillRect(0, 0, w, h);
      const glow = junCtx.createRadialGradient(w*0.5, h*0.45, 0, w*0.5, h*0.45, w*0.4);
      glow.addColorStop(0, 'rgba(30,55,120,0.45)');
      glow.addColorStop(1, 'rgba(3,8,20,0)');
      junCtx.fillStyle = glow;
      junCtx.fillRect(0, 0, w, h);
      for (const s of junStars) {
        const o = s.base + Math.sin(t * s.freq * 1000 + s.phase) * s.amp;
        junCtx.beginPath();
        junCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        junCtx.fillStyle = `rgba(200,225,255,${Math.min(1, Math.max(0, o))})`;
        junCtx.fill();
      }
      requestAnimationFrame(animateJun);
    }


    // ── Name animation (loops every 1 min) ───────────────────────────────────

    const LOOP_MS = 1 * 60 * 1000;
    const HOLD_MS = 55 * 1000;

    function runNameCycle() {
      const nameEl  = document.getElementById('jun-name');
      const letters = [...nameEl.querySelectorAll('.letter')];
      letters.forEach(el => { el.classList.remove('appearing'); void el.offsetWidth; });
      nameEl.style.transition = 'none';
      nameEl.style.opacity    = '1';
      void nameEl.offsetWidth;
      nameEl.style.transition = '';
      const stagger = 220, startAt = 400;
      letters.forEach((el, i) => {
        setTimeout(() => el.classList.add('appearing'), startAt + i * stagger);
      });
      const revealDone = startAt + (letters.length - 1) * stagger + 1400;
      setTimeout(() => { nameEl.style.opacity = '0'; }, revealDone + HOLD_MS);
    }


    // ── Boot ──────────────────────────────────────────────────────────────────

    window.addEventListener('load', () => {
      setTimeout(() => {
        resize();
        window.addEventListener('resize', resize);
        setTimeout(spawnShooter, 2000 + Math.random() * 1000);
        setTimeout(spawnBigShooter, 3000 + Math.random() * 1000);
        requestAnimationFrame(animateBg);
        initJunStars();
        requestAnimationFrame(animateJun);
        setTimeout(() => document.getElementById('bloom').classList.add('blooming'), 300);
        setTimeout(() => document.getElementById('silhouette').classList.add('visible'), 900);
        runNameCycle();
        setInterval(runNameCycle, LOOP_MS);
      }, 100);
    });
  </script>
</body>
</html>
